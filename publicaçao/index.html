<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#102019" />
  <title>BABA HUMILDES | Palestina - Salvador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#inicio" aria-label="Baba Humildes início">
        <div class="brand-mark">
          <img src="./public/escudo-baba-humildes-4k.png" alt="Escudo Baba Humildes">
        </div>
        <div><strong>BABA <span>HUMILDES</span></strong><small>PALESTINA • SALVADOR</small></div>
      </a>
      <div class="side-label">MENU PRINCIPAL</div>
      <nav id="navigation">
        <button class="nav-item active" data-page="inicio"><span>⌂</span> Visão geral</button>
        <button class="nav-item" data-page="atletas"><span>♙</span> Atletas & Elenco</button>
        <button class="nav-item" data-page="times"><span>⚑</span> Times & Tabela</button>
        <button class="nav-item" data-page="partidas"><span>◷</span> Partidas & Súmula</button>
        <button class="nav-item" data-page="estatisticas"><span>▥</span> Estatísticas</button>
        <button class="nav-item" data-page="financeiro"><span>＄</span> Financeiro</button>
        <button class="nav-item" data-page="avisos"><span>📢</span> Avisos Oficiais</button>
        <button class="nav-item" data-page="juizes"><span>⚖</span> Quadro de Árbitros</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sunday-card">
          <span class="live-dot"></span>
          <div>
            <b id="sidebarSeasonLabel">Temporada Ativa: 2026</b>
            <small id="sidebarFeeLabel">Mensalidade: R$ 25,00</small>
          </div>
        </div>
        <button class="admin-entry" id="adminButton">
          ⚙ Área administrativa <span id="adminStatus">Entrar →</span>
        </button>
        <button class="admin-entry athlete-entry-btn" id="athleteButton">
          ⚽ Área do Atleta <span>Entrar →</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Abrir menu">☰</button>
        <div>
          <div class="eyebrow" id="topbarEyebrow">PALESTINA / SALVADOR - BA • TEMPORADA OFICIAL</div>
          <div class="top-title" id="pageTitle">Visão geral</div>
        </div>
        <div class="top-actions">
          <span class="season-badge" id="topbarSeasonBadge">Temporada 2026</span>
          <span class="public-pill"><i></i> Portal público</span>
          <div class="avatar" id="topbarAvatar" title="Baba Humildes">
            <img src="./public/escudo-baba-humildes-4k.png" alt="Baba Humildes">
          </div>
        </div>
      </header>
      
      <div class="content" id="appContent">
        <!-- O conteúdo dinâmico de cada página é renderizado aqui pelo app.js -->
      </div>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  
  <dialog id="adminDialog" class="modal">
    <form method="dialog" class="modal-close"><button aria-label="Fechar">×</button></form>
    <div id="adminDialogBody"></div>
  </dialog>
  
  <dialog id="editDialog" class="modal wide">
    <form method="dialog" class="modal-close"><button aria-label="Fechar">×</button></form>
    <div id="editDialogBody"></div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>

</html>
