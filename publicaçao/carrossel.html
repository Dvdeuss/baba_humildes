<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrossel de Fotos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      min-height: 100vh;
      background-color: #111;
      font-family: system-ui, sans-serif;
    }

    .carrossel {
      position: relative;
      width: 100%;
      max-width: 700px;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 12px;
    }

    .slides {
      display: flex;
      height: 100%;
      transition: transform 0.45s ease-in-out;
    }

    .slides img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      flex-shrink: 0;
      cursor: zoom-in;
    }

    .btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    .prev {
      left: 12px;
    }

    .next {
      right: 12px;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dots button {
      width: 10px;
      height: 10px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #555;
      cursor: pointer;
    }

    .dots button.active {
      background: #ffd874;
      transform: scale(1.2);
    }

    #viewer {
      width: min(92vw, 1000px);
      max-height: 92vh;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 14px;
      background: #0b151e;
      color: #fff;
    }

    #viewer img {
      display: block;
      max-width: 100%;
      max-height: 84vh;
      margin: 0 auto;
      object-fit: contain;
      border-radius: 10px;
    }

    #viewer .close {
      display: block;
      margin: 10px auto 0;
      padding: 6px 16px;
      border: 1px solid #ffd874;
      border-radius: 8px;
      background: transparent;
      color: #ffd874;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="carrossel" id="carrossel">
    <div class="slides" id="slides">
      <img src="https://picsum.photos/seed/baba1/800/600" alt="Foto 1" />
      <img src="https://picsum.photos/seed/baba2/800/600" alt="Foto 2" />
      <img src="https://picsum.photos/seed/baba3/800/600" alt="Foto 3" />
    </div>
    <button class="btn prev" id="prev" aria-label="Foto anterior">&#10094;</button>
    <button class="btn next" id="next" aria-label="Próxima foto">&#10095;</button>
  </div>
  <div class="dots" id="dots"></div>

  <dialog id="viewer">
    <img id="viewerImg" src="" alt="Imagem ampliada" />
    <button class="close" id="closeViewer" type="button">Fechar</button>
  </dialog>

  <script>
    const carrossel = document.getElementById("carrossel");
    const slides = document.getElementById("slides");
    const dots = document.getElementById("dots");
    const viewer = document.getElementById("viewer");
    const viewerImg = document.getElementById("viewerImg");
    const totalSlides = slides.children.length;
    let indiceAtual = 0;
    let intervalo;

    dots.innerHTML = Array.from({ length: totalSlides }, (_, i) => `<button type="button" aria-label="Ir para foto ${i + 1}"></button>`).join("");

    function atualizarCarrossel() {
      slides.style.transform = `translateX(-${indiceAtual * 100}%)`;
      [...dots.children].forEach((dot, i) => dot.classList.toggle("active", i === indiceAtual));
    }

    function iniciarAutoplay() {
      clearInterval(intervalo);
      intervalo = setInterval(() => {
        indiceAtual = (indiceAtual + 1) % totalSlides;
        atualizarCarrossel();
      }, 3500);
    }

    document.getElementById("next").addEventListener("click", () => {
      indiceAtual = (indiceAtual + 1) % totalSlides;
      atualizarCarrossel();
    });

    document.getElementById("prev").addEventListener("click", () => {
      indiceAtual = (indiceAtual - 1 + totalSlides) % totalSlides;
      atualizarCarrossel();
    });

    [...dots.children].forEach((dot, i) => {
      dot.addEventListener("click", () => {
        indiceAtual = i;
        atualizarCarrossel();
      });
    });

    [...slides.children].forEach((img, i) => {
      img.addEventListener("click", () => {
        clearInterval(intervalo);
        viewerImg.src = img.src;
        viewer.showModal();
      });
    });

    document.getElementById("closeViewer").addEventListener("click", () => viewer.close());
    viewer.addEventListener("click", event => {
      if (event.target === viewer) viewer.close();
    });
    viewer.addEventListener("close", iniciarAutoplay);

    carrossel.addEventListener("mouseenter", () => clearInterval(intervalo));
    carrossel.addEventListener("mouseleave", iniciarAutoplay);

    atualizarCarrossel();
    iniciarAutoplay();
  </script>
</body>
</html>
